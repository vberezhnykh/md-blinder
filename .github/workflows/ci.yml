name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# Real documents and model-quality captures remain local and must never be
# uploaded as CI fixtures/artifacts. Browser regressions use synthetic data and
# a deterministic NER transport, with the real UI, structural worker and IDB.

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Use the lockfile's npm version
        run: npm install --global npm@11.19.0 --no-audit --no-fund

      - name: Install dependencies
        run: npm ci --include=optional --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Check dependency advisories
        if: runner.os == 'Linux'
        run: npm audit --audit-level=high

      - name: Install Chromium
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium

      - name: Browser regressions against production build
        if: runner.os == 'Linux'
        run: npm run test:e2e
