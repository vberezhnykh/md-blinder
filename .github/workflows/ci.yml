name: CI

on:
  push:
  pull_request:

# The golden harness (scripts/e2e-detect.mjs + scripts/score.mjs) runs against the
# confidential local corpus in test-samples/ and is deliberately NOT run in CI.
# CI covers only lint + the synthetic unit tests on the clean core.

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm install`, not `npm ci`: the lockfile is generated on Windows, and
      # vite 8 / rolldown's platform-specific optional native bindings resolve
      # their transitive deps (e.g. @emnapi/core) differently on Linux, so the
      # strict `npm ci` sync check fails on the CI runner ("Missing … from lock
      # file"). `npm install` reconciles those optional deps for the runner's
      # platform without weakening the lint/test signal.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test
